  icon = "soundcloud"
  url = "https://soundcloud.com/a"

[[params.social]]
  name = "youtube"
  icon = "youtube"
  url = "https://youtube.com/@a"

[[params.social]]
  name = "instagram"
  icon = "instagram"
  url = "https://instagram.com/a"